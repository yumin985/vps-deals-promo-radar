<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Compare a VPS upfront payment and renewal rate only after fields match</title><desc id="desc">A four-step checklist requires plan, currency, upfront term, and renewal term to match.</desc><rect width="1200" height="630" fill="#e5f2eb"/><text x="74" y="88" fill="#176b4b" font-family="Arial,sans-serif" font-size="26" font-weight="700" letter-spacing="3">VPS DEALS · TERM-AWARE COMPARISON</text><text x="74" y="142" fill="#15231e" font-family="Arial,sans-serif" font-size="42" font-weight="700">Match four labels before comparing prices</text><g font-family="Arial,sans-serif"><g transform="translate(74 215)"><rect width="242" height="202" rx="18" fill="white" stroke="#d5e7db" stroke-width="3"/><circle cx="38" cy="40" r="22" fill="#176b4b"/><text x="38" y="47" text-anchor="middle" fill="white" font-size="21" font-weight="700">1</text><text x="30" y="98" fill="#15231e" font-size="26" font-weight="700">PLAN</text><text x="30" y="135" fill="#435b50" font-size="19">same tier and</text><text x="30" y="162" fill="#435b50" font-size="19">configuration</text></g><g transform="translate(344 215)"><rect width="242" height="202" rx="18" fill="white" stroke="#d5e7db" stroke-width="3"/><circle cx="38" cy="40" r="22" fill="#176b4b"/><text x="38" y="47" text-anchor="middle" fill="white" font-size="21" font-weight="700">2</text><text x="30" y="98" fill="#15231e" font-size="26" font-weight="700">CURRENCY</text><text x="30" y="135" fill="#435b50" font-size="19">do not cross</text><text x="30" y="162" fill="#435b50" font-size="19">currencies</text></g><g transform="translate(614 215)"><rect width="242" height="202" rx="18" fill="white" stroke="#d5e7db" stroke-width="3"/><circle cx="38" cy="40" r="22" fill="#e9a84b"/><text x="38" y="47" text-anchor="middle" fill="#15231e" font-size="21" font-weight="700">3</text><text x="30" y="98" fill="#15231e" font-size="26" font-weight="700">PAY NOW</text><text x="30" y="135" fill="#435b50" font-size="19">amount plus</text><text x="30" y="162" fill="#435b50" font-size="19">first-term length</text></g><g transform="translate(884 215)"><rect width="242" height="202" rx="18" fill="white" stroke="#d5e7db" stroke-width="3"/><circle cx="38" cy="40" r="22" fill="#e9a84b"/><text x="38" y="47" text-anchor="middle" fill="#15231e" font-size="21" font-weight="700">4</text><text x="30" y="98" fill="#15231e" font-size="26" font-weight="700">RENEWAL</text><text x="30" y="135" fill="#435b50" font-size="19">amount, unit,</text><text x="30" y="162" fill="#435b50" font-size="19">and renewal term</text></g></g><rect x="74" y="480" width="1052" height="74" rx="15" fill="#fff7e9"/><text x="108" y="525" fill="#66543a" font-family="Arial,sans-serif" font-size="24" font-weight="700">Any unmatched label → comparison unresolved. Unknown is not a value to estimate.</text></svg>
