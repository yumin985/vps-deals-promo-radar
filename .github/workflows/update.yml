name: Refresh public VPS offers
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-offer-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Extract project source
        run: python -c "import zipfile; zipfile.ZipFile('project-source.zip').extractall('.')"
      - name: Collect public structured offers
        run: python scraper.py
      - name: Build static pages
        run: python build.py
      - name: Commit changed snapshot and site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/offers.json site/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Refresh verified VPS offer snapshot"
            git push
          fi
