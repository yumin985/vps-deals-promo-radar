<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Contabo coupon evidence</title><desc id="desc">A coupon evidence card where the code and expiry remain unknown until an official source publishes them.</desc><rect width="1200" height="630" rx="28" fill="#102a43"/><rect x="54" y="54" width="1092" height="522" rx="22" fill="#f7faf8"/><rect x="54" y="54" width="18" height="522" fill="#176b4b"/><text x="110" y="150" font-family="Arial,sans-serif" font-size="44" font-weight="700" fill="#15231e">Coupon evidence, before checkout</text><text x="110" y="198" font-family="Arial,sans-serif" font-size="24" fill="#486581">Official code + expiry required for a valid claim</text><rect x="110" y="270" width="435" height="155" rx="16" fill="#fff7e9"/><rect x="575" y="270" width="485" height="155" rx="16" fill="#e5f2eb"/><text x="150" y="330" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176b4b">Code</text><text x="150" y="380" font-family="Arial,sans-serif" font-size="32" fill="#66543a">UNKNOWN</text><text x="615" y="330" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176b4b">Expiry date</text><text x="615" y="380" font-family="Arial,sans-serif" font-size="32" fill="#435b50">UNKNOWN</text><text x="110" y="500" font-family="Arial,sans-serif" font-size="22" fill="#65766e">Do not turn a “verified” label into a code claim.</text></svg>
