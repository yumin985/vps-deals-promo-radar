<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">VPS billing term evidence trail</title><desc id="desc">Three connected cards: plan, billing term, and evidence.</desc><rect width="1200" height="500" rx="28" fill="#e5f2eb"/><text x="70" y="84" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#176b4b">CHECK THE TERM, KEEP THE TRAIL</text><g font-family="Arial,sans-serif"><g transform="translate(70 145)"><rect width="300" height="240" rx="18" fill="#fff" stroke="#b8d7c4" stroke-width="3"/><text x="30" y="65" font-size="22" font-weight="700" fill="#15231e">1. Exact plan</text><text x="30" y="112" font-size="19" fill="#435b50">name · currency</text><text x="30" y="145" font-size="19" fill="#435b50">billing period</text></g><path d="M390 265h90" stroke="#e9a84b" stroke-width="8"/><path d="m465 245 25 20-25 20" fill="none" stroke="#e9a84b" stroke-width="8"/><g transform="translate(490 145)"><rect width="300" height="240" rx="18" fill="#fff" stroke="#b8d7c4" stroke-width="3"/><text x="30" y="65" font-size="22" font-weight="700" fill="#15231e">2. Recurring term</text><text x="30" y="112" font-size="19" fill="#435b50">explicit amount?</text><text x="30" y="145" font-size="19" fill="#435b50">if absent: unknown</text></g><path d="M810 265h90" stroke="#e9a84b" stroke-width="8"/><path d="m885 245 25 20-25 20" fill="none" stroke="#e9a84b" stroke-width="8"/><g transform="translate(910 145)"><rect width="220" height="240" rx="18" fill="#fff" stroke="#b8d7c4" stroke-width="3"/><text x="30" y="65" font-size="22" font-weight="700" fill="#15231e">3. Evidence</text><text x="30" y="112" font-size="19" fill="#435b50">URL + UTC time</text><text x="30" y="145" font-size="19" fill="#435b50">recheck checkout</text></g></g></svg>
