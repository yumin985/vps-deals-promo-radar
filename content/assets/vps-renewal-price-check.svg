<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">VPS renewal price check</title><desc id="desc">Three steps: match the plan, find recurring terms, save the source and time.</desc><rect width="1200" height="520" rx="28" fill="#e5f2eb"/><text x="72" y="82" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#15231e">VPS renewal price check</text><text x="72" y="120" font-family="Arial,sans-serif" font-size="20" fill="#435b50">Keep the evidence tied to the provider's public page.</text><g font-family="Arial,sans-serif"><g transform="translate(72,180)"><rect width="310" height="230" rx="20" fill="#fff" stroke="#b9d8c6" stroke-width="3"/><circle cx="54" cy="58" r="28" fill="#176b4b"/><text x="54" y="68" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">1</text><text x="98" y="66" font-size="23" font-weight="700" fill="#15231e">Match the plan</text><text x="28" y="122" font-size="18" fill="#435b50">Name · currency</text><text x="28" y="154" font-size="18" fill="#435b50">Billing period</text><text x="28" y="190" font-size="16" fill="#65766e">Copy what the source shows.</text></g><g transform="translate(445,180)"><rect width="310" height="230" rx="20" fill="#fff" stroke="#b9d8c6" stroke-width="3"/><circle cx="54" cy="58" r="28" fill="#176b4b"/><text x="54" y="68" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">2</text><text x="98" y="66" font-size="23" font-weight="700" fill="#15231e">Find recurring terms</text><text x="28" y="122" font-size="18" fill="#435b50">Renewal amount</text><text x="28" y="154" font-size="18" fill="#435b50">After promotion</text><text x="28" y="190" font-size="16" fill="#65766e">No published term = unknown.</text></g><g transform="translate(818,180)"><rect width="310" height="230" rx="20" fill="#fff" stroke="#b9d8c6" stroke-width="3"/><circle cx="54" cy="58" r="28" fill="#176b4b"/><text x="54" y="68" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">3</text><text x="98" y="66" font-size="23" font-weight="700" fill="#15231e">Save evidence</text><text x="28" y="122" font-size="18" fill="#435b50">Official URL</text><text x="28" y="154" font-size="18" fill="#435b50">Fetched-at time</text><text x="28" y="190" font-size="16" fill="#65766e">Recheck at checkout.</text></g></g></svg>
