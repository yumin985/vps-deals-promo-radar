<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Compare a VPS deal when tax appears at checkout</title><desc id="desc">A four-step evidence card showing display rate, term and subtotal, tax and fees, and final total.</desc><rect width="1200" height="700" rx="36" fill="#e5f2eb"/><text x="70" y="100" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#15231e">Keep checkout tax in its own field</text><text x="70" y="145" font-family="Arial,sans-serif" font-size="24" fill="#435b50">Compare only the amounts you can verify.</text><g font-family="Arial,sans-serif"><rect x="70" y="220" width="250" height="300" rx="22" fill="#fff" stroke="#176b4b" stroke-width="4"/><text x="100" y="280" font-size="26" font-weight="700" fill="#176b4b">1</text><text x="100" y="330" font-size="28" font-weight="700" fill="#15231e">Display rate</text><text x="100" y="380" font-size="21" fill="#435b50">Copy unit + currency.</text><text x="100" y="425" font-size="21" fill="#435b50">“/month” may be</text><text x="100" y="455" font-size="21" fill="#435b50">a prepaid division.</text><rect x="350" y="220" width="250" height="300" rx="22" fill="#fff" stroke="#176b4b" stroke-width="4"/><text x="380" y="280" font-size="26" font-weight="700" fill="#176b4b">2</text><text x="380" y="330" font-size="28" font-weight="700" fill="#15231e">Term + subtotal</text><text x="380" y="380" font-size="21" fill="#435b50">Record what is due</text><text x="380" y="415" font-size="21" fill="#435b50">before tax or fees.</text><rect x="630" y="220" width="250" height="300" rx="22" fill="#fff" stroke="#176b4b" stroke-width="4"/><text x="660" y="280" font-size="26" font-weight="700" fill="#176b4b">3</text><text x="660" y="330" font-size="28" font-weight="700" fill="#15231e">Tax + fees</text><text x="660" y="380" font-size="21" fill="#435b50">Use checkout lines.</text><text x="660" y="415" font-size="21" fill="#435b50">Unknown is not zero.</text><rect x="910" y="220" width="220" height="300" rx="22" fill="#fff7e9" stroke="#e9a84b" stroke-width="4"/><text x="940" y="280" font-size="26" font-weight="700" fill="#a16412">4</text><text x="940" y="330" font-size="28" font-weight="700" fill="#15231e">Final total</text><text x="940" y="380" font-size="21" fill="#66543a">Verify currency</text><text x="940" y="415" font-size="21" fill="#66543a">and amount now.</text></g></svg>
