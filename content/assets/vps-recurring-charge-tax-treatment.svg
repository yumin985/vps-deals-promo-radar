<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Recurring VPS charge and tax evidence chain</title><desc id="desc">A five-step evidence chain from plan and term to recurring amount, subtotal, tax, and total.</desc><rect width="1200" height="620" rx="32" fill="#e5f2eb"/><text x="72" y="92" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#15231e">Separate the charge from the tax</text><text x="72" y="132" font-family="Arial,sans-serif" font-size="20" fill="#435b50">Copy each checkout field; never infer the missing one.</text><g font-family="Arial,sans-serif" font-size="22" fill="#15231e"><rect x="72" y="220" width="190" height="150" rx="18" fill="#fff" stroke="#176b4b" stroke-width="3"/><text x="96" y="266">1  Plan + term</text><text x="96" y="306" font-size="18" fill="#65766e">same period</text><rect x="292" y="220" width="190" height="150" rx="18" fill="#fff" stroke="#176b4b" stroke-width="3"/><text x="316" y="266">2  Recurring</text><text x="316" y="306" font-size="18" fill="#65766e">only if stated</text><rect x="512" y="220" width="190" height="150" rx="18" fill="#fff" stroke="#176b4b" stroke-width="3"/><text x="536" y="266">3  Subtotal</text><text x="536" y="306" font-size="18" fill="#65766e">pre-tax</text><rect x="732" y="220" width="170" height="150" rx="18" fill="#fff7e9" stroke="#e9a84b" stroke-width="3"/><text x="756" y="266">4  Tax</text><text x="756" y="306" font-size="18" fill="#66543a">location</text><rect x="932" y="220" width="190" height="150" rx="18" fill="#fff" stroke="#176b4b" stroke-width="3"/><text x="956" y="266">5  Total</text><text x="956" y="306" font-size="18" fill="#65766e">charged now</text></g><g stroke="#176b4b" stroke-width="5" fill="none"><path d="M262 295h30"/><path d="M482 295h30"/><path d="M702 295h30"/><path d="M902 295h30"/></g><text x="72" y="470" font-family="Arial,sans-serif" font-size="22" fill="#176b4b">Unknown values stay unknown until the provider publishes them.</text></svg>
