<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Verify a checkout tax line</title><desc id="desc">Four connected fields: billing term, subtotal, tax, and total.</desc><rect width="1200" height="630" rx="28" fill="#102a43"/><rect x="54" y="54" width="1092" height="522" rx="22" fill="#f7faf8"/><rect x="54" y="54" width="18" height="522" fill="#176b4b"/><text x="110" y="150" font-family="Arial,sans-serif" font-size="44" font-weight="700" fill="#15231e">Match the checkout fields</text><text x="110" y="198" font-family="Arial,sans-serif" font-size="24" fill="#486581">Same term · currency · subtotal · final total</text><g font-family="Arial,sans-serif"><rect x="110" y="270" width="215" height="140" rx="16" fill="#e5f2eb"/><rect x="355" y="270" width="215" height="140" rx="16" fill="#e5f2eb"/><rect x="600" y="270" width="215" height="140" rx="16" fill="#fff7e9"/><rect x="845" y="270" width="215" height="140" rx="16" fill="#e5f2eb"/><g font-size="22" font-weight="700" fill="#176b4b"><text x="145" y="330">1  Billing term</text><text x="402" y="330">2  Subtotal</text><text x="665" y="330">3  Tax line</text><text x="915" y="330">4  Total</text></g><g font-size="17" fill="#435b50"><text x="145" y="370">period + currency</text><text x="402" y="370">before tax/fees</text><text x="665" y="370">location amount</text><text x="915" y="370">charged now</text></g></g><text x="110" y="500" font-family="Arial,sans-serif" font-size="22" fill="#65766e">Unknown stays unknown until checkout shows the value.</text></svg>
