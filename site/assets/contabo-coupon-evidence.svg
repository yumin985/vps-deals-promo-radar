<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Contabo discount path evidence</title><desc id="desc">Current monthly price multiplied by the stated 24-month term, with calendar expiry unknown.</desc><rect width="1200" height="630" rx="28" fill="#102a43"/><rect x="54" y="54" width="1092" height="522" rx="22" fill="#f7faf8"/><rect x="54" y="54" width="18" height="522" fill="#176b4b"/><text x="110" y="150" font-family="Arial,sans-serif" font-size="44" font-weight="700" fill="#15231e">Discount path, before checkout</text><text x="110" y="198" font-family="Arial,sans-serif" font-size="24" fill="#486581">Monthly rate × 24 months = upfront amount</text><rect x="110" y="270" width="300" height="155" rx="16" fill="#e5f2eb"/><rect x="450" y="270" width="300" height="155" rx="16" fill="#e5f2eb"/><rect x="790" y="270" width="270" height="155" rx="16" fill="#fff7e9"/><text x="145" y="330" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#176b4b">Current</text><text x="145" y="380" font-family="Arial,sans-serif" font-size="28" fill="#435b50">$4.40/mo</text><text x="485" y="330" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#176b4b">24 months</text><text x="485" y="380" font-family="Arial,sans-serif" font-size="28" fill="#435b50">$105.60</text><text x="825" y="330" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#176b4b">Calendar end</text><text x="825" y="380" font-family="Arial,sans-serif" font-size="28" fill="#66543a">UNKNOWN</text><text x="110" y="500" font-family="Arial,sans-serif" font-size="22" fill="#65766e">Use the official entry path and recheck checkout totals.</text></svg>
