<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">VPS checkout evidence fields</title><desc id="desc">A source-first four-step diagram showing display rate, upfront total, payment term, and recurring term.</desc><rect width="1200" height="630" fill="#0b1020"/><text x="70" y="90" fill="#f8fafc" font-family="Arial,sans-serif" font-size="42" font-weight="700">VPS checkout evidence</text><text x="70" y="135" fill="#a5b4fc" font-family="Arial,sans-serif" font-size="24">Separate the fields before comparing a deal</text><g font-family="Arial,sans-serif"><g transform="translate(70 205)"><rect width="250" height="250" rx="22" fill="#18233d" stroke="#6ee7b7" stroke-width="3"/><text x="24" y="60" fill="#6ee7b7" font-size="22" font-weight="700">01</text><text x="24" y="112" fill="#fff" font-size="28" font-weight="700">Display rate</text><text x="24" y="158" fill="#cbd5e1" font-size="20">“/month” unit</text><text x="24" y="194" fill="#cbd5e1" font-size="20">is a label to verify</text></g><g transform="translate(345 205)"><rect width="250" height="250" rx="22" fill="#18233d" stroke="#fbbf24" stroke-width="3"/><text x="24" y="60" fill="#fbbf24" font-size="22" font-weight="700">02</text><text x="24" y="112" fill="#fff" font-size="28" font-weight="700">Upfront total</text><text x="24" y="158" fill="#cbd5e1" font-size="20">amount charged</text><text x="24" y="194" fill="#cbd5e1" font-size="20">and currency</text></g><g transform="translate(620 205)"><rect width="250" height="250" rx="22" fill="#18233d" stroke="#60a5fa" stroke-width="3"/><text x="24" y="60" fill="#60a5fa" font-size="22" font-weight="700">03</text><text x="24" y="112" fill="#fff" font-size="28" font-weight="700">Payment term</text><text x="24" y="158" fill="#cbd5e1" font-size="20">monthly, annual,</text><text x="24" y="194" fill="#cbd5e1" font-size="20">or stated period</text></g><g transform="translate(895 205)"><rect width="235" height="250" rx="22" fill="#18233d" stroke="#fb7185" stroke-width="3"/><text x="24" y="60" fill="#fb7185" font-size="22" font-weight="700">04</text><text x="24" y="112" fill="#fff" font-size="28" font-weight="700">Recurring term</text><text x="24" y="158" fill="#cbd5e1" font-size="20">renewal amount</text><text x="24" y="194" fill="#cbd5e1" font-size="20">or “unknown”</text></g></g><text x="70" y="550" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="24">Source-first VPS deals comparison • verify the official checkout</text></svg>
