<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Five-step VPS deal freshness audit</title><desc id="desc">A source-first five-step audit: match, open, timestamp, terms, evidence.</desc>
<rect width="1200" height="630" fill="#102a43"/><rect x="48" y="48" width="1104" height="534" rx="28" fill="#f4f7fb"/>
<text x="92" y="125" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#102a43">VPS deals: 5-minute freshness audit</text>
<text x="92" y="165" font-family="Arial,sans-serif" font-size="22" fill="#486581">Verify the source before you compare the price.</text>
<g font-family="Arial,sans-serif" font-size="22" fill="#102a43"><circle cx="150" cy="270" r="48" fill="#2f80ed"/><text x="142" y="278" fill="white" font-weight="700">1</text><text x="220" y="278">Match plan + currency</text><circle cx="150" cy="370" r="48" fill="#2f80ed"/><text x="142" y="378" fill="white" font-weight="700">2</text><text x="220" y="378">Open source + offer links</text><circle cx="150" cy="470" r="48" fill="#2f80ed"/><text x="142" y="478" fill="white" font-weight="700">3</text><text x="220" y="478">Read fetched-at time</text><circle cx="720" cy="270" r="48" fill="#16a085"/><text x="712" y="278" fill="white" font-weight="700">4</text><text x="790" y="278">Check term + renewal</text><circle cx="720" cy="370" r="48" fill="#16a085"/><text x="712" y="378" fill="white" font-weight="700">5</text><text x="790" y="378">Save evidence note</text></g>
<rect x="680" y="430" width="390" height="92" rx="18" fill="#d9f2ec"/><text x="715" y="470" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0b6e4f">Unknown fields stay unknown.</text><text x="715" y="502" font-family="Arial,sans-serif" font-size="18" fill="#0b6e4f">Recheck the provider before paying.</text>
</svg>
