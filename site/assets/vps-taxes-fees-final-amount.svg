<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">VPS final amount evidence</title><desc id="d">A four-step path from display rate to final amount due.</desc><rect width="1200" height="630" rx="36" fill="#e5f2eb"/><rect x="60" y="60" width="1080" height="510" rx="28" fill="#fff" stroke="#dce7e1" stroke-width="4"/><text x="100" y="145" font-family="Arial,sans-serif" font-size="44" font-weight="700" fill="#15231e">VPS final amount due</text><text x="100" y="190" font-family="Arial,sans-serif" font-size="24" fill="#65766e">Keep every checkout field visible before you compare</text><g font-family="Arial,sans-serif"><rect x="100" y="255" width="220" height="170" rx="18" fill="#edf5ef"/><text x="130" y="305" font-size="22" font-weight="700" fill="#176b4b">1. Display rate</text><text x="130" y="345" font-size="20" fill="#15231e">$ / month</text><rect x="350" y="255" width="220" height="170" rx="18" fill="#edf5ef"/><text x="380" y="305" font-size="22" font-weight="700" fill="#176b4b">2. Term</text><text x="380" y="345" font-size="20" fill="#15231e">months covered</text><rect x="600" y="255" width="220" height="170" rx="18" fill="#fff7e9"/><text x="630" y="305" font-size="22" font-weight="700" fill="#8b6225">3. Tax + fees</text><text x="630" y="345" font-size="20" fill="#15231e">shown or unknown</text><rect x="850" y="255" width="220" height="170" rx="18" fill="#176b4b"/><text x="880" y="305" font-size="22" font-weight="700" fill="#fff">4. Due now</text><text x="880" y="345" font-size="20" fill="#fff">checkout total</text><path d="M320 340h30m220 0h30m220 0h30" stroke="#176b4b" stroke-width="8" stroke-linecap="round"/><text x="100" y="500" font-family="Arial,sans-serif" font-size="24" fill="#435b50">Unknown is a recorded field, never an invented zero.</text></g></svg>
