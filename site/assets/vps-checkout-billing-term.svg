<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">VPS checkout billing term checklist</title><desc id="desc">A three-step source-first checklist: match plan, verify first term, confirm renewal wording.</desc><rect width="1200" height="630" fill="#102a43"/><rect x="56" y="54" width="1088" height="522" rx="28" fill="#f5f7fa"/><text x="96" y="132" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#102a43">VPS checkout billing term</text><text x="96" y="180" font-family="Arial,sans-serif" font-size="24" fill="#486581">Check the evidence before paying</text><g font-family="Arial,sans-serif"><rect x="96" y="244" width="300" height="210" rx="18" fill="#d9eaf7"/><text x="128" y="300" font-size="24" font-weight="700" fill="#102a43">1  Match</text><text x="128" y="342" font-size="21" fill="#102a43">Plan and tier</text><text x="128" y="376" font-size="18" fill="#486581">same product at checkout</text><rect x="450" y="244" width="300" height="210" rx="18" fill="#e3f1e8"/><text x="482" y="300" font-size="24" font-weight="700" fill="#102a43">2  Record</text><text x="482" y="342" font-size="21" fill="#102a43">First term</text><text x="482" y="376" font-size="18" fill="#486581">amount, currency, period</text><rect x="804" y="244" width="300" height="210" rx="18" fill="#fce8d5"/><text x="836" y="300" font-size="24" font-weight="700" fill="#102a43">3  Confirm</text><text x="836" y="342" font-size="21" fill="#102a43">Renewal wording</text><text x="836" y="376" font-size="18" fill="#486581">unknown if absent</text><text x="96" y="520" font-size="22" font-weight="700" fill="#102a43">Save official URL + UTC fetched-at time</text></g></svg>
