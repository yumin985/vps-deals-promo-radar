<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Read VPS billing wording</title><desc id="desc">A four step diagram for separating monthly display rate, payment period, promotion length and renewal amount.</desc><rect width="1200" height="630" rx="28" fill="#e5f2eb"/><rect x="60" y="56" width="18" height="518" rx="9" fill="#176b4b"/><text x="120" y="130" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#15231e">Read the billing term</text><text x="120" y="180" font-family="Arial,sans-serif" font-size="25" fill="#435b50">Keep each wording field separate.</text><g font-family="Arial,sans-serif" font-size="25" fill="#15231e"><rect x="120" y="245" width="430" height="74" rx="14" fill="#fff" stroke="#dce7e1"/><text x="150" y="291">1  Display rate: “/month”</text><rect x="650" y="245" width="430" height="74" rx="14" fill="#fff" stroke="#dce7e1"/><text x="680" y="291">2  Payment: upfront term</text><rect x="120" y="360" width="430" height="74" rx="14" fill="#fff" stroke="#dce7e1"/><text x="150" y="406">3  Promotion: “for 3 months”</text><rect x="650" y="360" width="430" height="74" rx="14" fill="#fff" stroke="#dce7e1"/><text x="680" y="406">4  Renewal: explicit or unknown</text></g><rect x="120" y="500" width="960" height="4" fill="#e9a84b"/><text x="120" y="548" font-family="Arial,sans-serif" font-size="23" fill="#65766e">vpsdealscout · verify the provider page before checkout</text></svg>
