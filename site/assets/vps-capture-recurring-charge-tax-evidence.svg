<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">VPS recurring charge and tax evidence record</title><desc id="desc">Five evidence fields flow from plan and term to today's payment, renewal amount, tax and total.</desc><rect width="1200" height="630" fill="#e5f2eb"/><text x="76" y="92" fill="#176b4b" font-family="Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="3">VPS DEALS · EVIDENCE RECORD</text><text x="76" y="145" fill="#15231e" font-family="Arial, sans-serif" font-size="43" font-weight="700">Separate the fields before you compare</text><line x1="145" y1="315" x2="1055" y2="315" stroke="#176b4b" stroke-width="8" stroke-linecap="round"/><g font-family="Arial, sans-serif"><g><circle cx="145" cy="315" r="50" fill="#176b4b"/><text x="145" y="306" text-anchor="middle" fill="white" font-size="19" font-weight="700">PLAN</text><text x="145" y="330" text-anchor="middle" fill="white" font-size="19" font-weight="700">+ TERM</text><text x="145" y="410" text-anchor="middle" fill="#15231e" font-size="21">same product</text></g><g><circle cx="373" cy="315" r="50" fill="#176b4b"/><text x="373" y="306" text-anchor="middle" fill="white" font-size="17" font-weight="700">TODAY’S</text><text x="373" y="330" text-anchor="middle" fill="white" font-size="17" font-weight="700">PAYMENT</text><text x="373" y="410" text-anchor="middle" fill="#15231e" font-size="21">copy if shown</text></g><g><circle cx="601" cy="315" r="50" fill="#176b4b"/><text x="601" y="306" text-anchor="middle" fill="white" font-size="16" font-weight="700">RENEWAL</text><text x="601" y="330" text-anchor="middle" fill="white" font-size="16" font-weight="700">AMOUNT</text><text x="601" y="410" text-anchor="middle" fill="#15231e" font-size="21">amount + term</text></g><g><circle cx="829" cy="315" r="50" fill="#e9a84b"/><text x="829" y="306" text-anchor="middle" fill="#15231e" font-size="19" font-weight="700">TAX</text><text x="829" y="330" text-anchor="middle" fill="#15231e" font-size="19" font-weight="700">LINE</text><text x="829" y="410" text-anchor="middle" fill="#15231e" font-size="21">location-specific</text></g><g><circle cx="1055" cy="315" r="50" fill="#176b4b"/><text x="1055" y="306" text-anchor="middle" fill="white" font-size="18" font-weight="700">TOTAL</text><text x="1055" y="330" text-anchor="middle" fill="white" font-size="18" font-weight="700">DUE</text><text x="1055" y="410" text-anchor="middle" fill="#15231e" font-size="21">same currency</text></g></g><rect x="76" y="498" width="1048" height="75" rx="14" fill="white" stroke="#d5e7db"/><text x="108" y="545" fill="#15231e" font-family="Arial, sans-serif" font-size="25">If a field is not published, record it as unknown — do not calculate it from a different field.</text></svg>
